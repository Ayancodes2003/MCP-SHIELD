[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-shield"
version = "0.1.0.dev0"
description = "Security gateway for MCP: authn/z, injection and tool-poisoning detection, taint tracking, approvals, tamper-evident audit."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "sqlalchemy>=2.0",
    "jsonschema>=4.22",
    "pyjwt[crypto]>=2.8",
    "mcp>=1.12,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-jsonschema",
]

[project.scripts]
mcp-shield = "mcp_shield.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_shield"]
exclude = ["*_test.rego"]

[tool.hatch.build.targets.wheel.force-include]
"policies" = "mcp_shield/policies"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.mypy]
strict = true
files = ["src/mcp_shield"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:Use `streamable_http_client` instead:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`",
]
markers = ["integration: requires docker compose services"]
addopts = "-m 'not integration'"

[tool.coverage.run]
source = ["src/mcp_shield"]

[tool.coverage.report]
fail_under = 85
show_missing = true
